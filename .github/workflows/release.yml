name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Runner images are pinned, not floated. `windows-latest` currently resolves to `windows-2025`, so
  # this changes nothing today — that is the point. The label moves on GitHub's schedule, not ours,
  # and this workflow is what produces the signed, attested binaries someone downloads and runs with
  # their security posture riding on it. A release built on an image no CI leg ever exercised is an
  # unreviewed change to the artifact, arriving without a commit. ci.yml pins the same way and covers
  # `windows-2022` beside it, so the image this release is built on is one the suite has actually run
  # on. Moving to a newer image is then a deliberate one-line commit here, reviewed like any other.
  build:
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            installer_language: french
          - architecture: arm64
            runner: windows-11-arm
            installer_language: spanish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.303"
          architecture: ${{ matrix.architecture }}
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Pinning the label is not the same as pinning the image. GitHub migrated both `windows-latest`
      # and `windows-2025` to a Visual Studio 2026 image in June 2026, and hosted images are re-cut
      # weekly regardless — so `runs-on: windows-2025` names a moving target, just a slowly moving
      # one. Recording the exact image beside the artifacts costs one step and turns "built on
      # windows-2025" into something a future reader can actually pin a difference to.
      - name: Record the runner image that built this
        shell: pwsh
        run: |
          $line = "``${{ matrix.architecture }}``: $env:ImageOS / image version ``$env:ImageVersion``"
          Write-Host $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $line"

      - name: Validate tag source and version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag is not a strict vX.Y.Z version."
          }
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:RELEASE_SHA) {
            throw "Checkout does not match the immutable release SHA."
          }
          & git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch main for release ancestry proof." }
          & git merge-base --is-ancestor $env:RELEASE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag does not point to a commit on main." }
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          [xml]$props = Get-Content Directory.Build.props
          $projectVersion = $props.Project.PropertyGroup.Version
          if ($tagVersion -cne $projectVersion) {
            throw "Tag version $tagVersion does not match project version $projectVersion."
          }

      - name: Restore, build and test tagged source
        shell: pwsh
        run: |
          dotnet restore winsight.sln
          dotnet build winsight.sln -c Release --no-restore
          # Keep the release oracle deterministic on the smaller native Arm64 runner. Running all
          # test projects at once can starve independent five-second filesystem/concurrency
          # rendezvous even though each project passes on the same runner in the CI coverage gate.
          dotnet test winsight.sln -c Release --no-build --maxcpucount:1 --logger "trx;LogFilePrefix=release-${{ matrix.architecture }}"

      - name: Verify formatting and dependencies
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          dotnet format winsight.sln --verify-no-changes --no-restore
          ./scripts/Test-VulnerablePackages.ps1

      # Signing happens inside Build-Release.ps1, before archives are compressed and before any
      # checksum is taken, so every published hash covers the final bytes. The repository policy must
      # be the explicit string "true" or "false": an absent or malformed value fails closed.
      - name: Build release artifacts
        shell: pwsh
        env:
          WINSIGHT_SIGNING_CERT_BASE64: ${{ secrets.WINSIGHT_SIGNING_CERT_BASE64 }}
          WINSIGHT_SIGNING_CERT_PASSWORD: ${{ secrets.WINSIGHT_SIGNING_CERT_PASSWORD }}
          REQUIRE_SIGNED_RELEASE: ${{ vars.REQUIRE_SIGNED_RELEASE }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $signingPolicy = $env:REQUIRE_SIGNED_RELEASE.Trim().ToLowerInvariant()
          if ($signingPolicy -notin @("true", "false")) {
            throw "REQUIRE_SIGNED_RELEASE must be explicitly set to true or false."
          }
          $requireSignature = $signingPolicy -eq "true"
          if (-not $requireSignature) {
            Write-Warning "UNSIGNED RELEASE POLICY: artifacts will have no Windows publisher identity."
            @"
          ### Authenticode policy

          `REQUIRE_SIGNED_RELEASE=false`: this release is intentionally unsigned. Verify its SHA-256
          checksums and GitHub attestations; Windows will display an unknown publisher.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          ./scripts/Build-Release.ps1 `
            -Version $version `
            -Architectures ${{ matrix.architecture }} `
            -RequireSignature:$requireSignature `
            -DisableSignature:(-not $requireSignature)

      - name: Test native installer lifecycle
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/Test-Installer.ps1 `
            -InstallerPath "out/release/winsight-v$version-win-${{ matrix.architecture }}-setup.exe" `
            -Version $version `
            -Architecture ${{ matrix.architecture }} `
            -InstallerLanguage ${{ matrix.installer_language }}

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.architecture }}
          path: |
            out/release/*.zip
            out/release/*.exe
            out/release/*.json
            out/release/*.sha256
          if-no-files-found: error

  # Pinned for the same reason as `build`: this job re-verifies the checksums and creates the public
  # release, so the image it runs on is part of how the artifacts are attested.
  publish:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release checksums
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          $expected = @(
            "winsight-$version-win-x64.zip",
            "winsight-$version-win-x64-setup.exe",
            "winsight-$version-win-x64.spdx.json",
            "winsight-$version-win-arm64.zip",
            "winsight-$version-win-arm64-setup.exe",
            "winsight-$version-win-arm64.spdx.json"
          )
          $files = @(Get-ChildItem -LiteralPath release-assets -File)
          $actualArtifacts = @($files | Where-Object Extension -ne '.sha256' | ForEach-Object Name)
          $actualChecksums = @($files | Where-Object Extension -eq '.sha256' | ForEach-Object Name)
          if (@(Compare-Object $expected $actualArtifacts).Count -ne 0) {
            throw "Release artifact set is incomplete or contains unexpected files."
          }
          if (@(Compare-Object @($expected | ForEach-Object { "$_`.sha256" }) $actualChecksums).Count -ne 0) {
            throw "Release checksum set is incomplete or contains unexpected files."
          }
          foreach ($name in $expected) {
            $artifact = Join-Path (Resolve-Path -LiteralPath release-assets).Path $name
            $checksumFile = "$artifact.sha256"
            $line = [IO.File]::ReadAllText($checksumFile).TrimEnd("`r", "`n")
            $match = [regex]::Match($line, '^(?<hash>[0-9a-f]{64})  (?<name>[^\\/]+)$', 'CultureInvariant')
            if (-not $match.Success -or $match.Groups['name'].Value -cne $name) {
              throw "Malformed or misbound checksum file: $checksumFile"
            }
            $actual = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $match.Groups['hash'].Value) { throw "Checksum mismatch for $artifact" }
          }

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*-setup.exe

      - name: Attest x64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release-assets/winsight-${{ env.RELEASE_TAG }}-win-x64.zip
          sbom-path: release-assets/winsight-${{ env.RELEASE_TAG }}-win-x64.spdx.json

      - name: Attest Arm64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release-assets/winsight-${{ env.RELEASE_TAG }}-win-arm64.zip
          sbom-path: release-assets/winsight-${{ env.RELEASE_TAG }}-win-arm64.spdx.json

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: release-assets/*
          generate_release_notes: true
